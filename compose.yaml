name: formdesk
services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: formdesk
      POSTGRES_USER: formdesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-formdesk_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - formdesk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formdesk -d formdesk"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    profiles: ["full"]
    build: ./formdesk-backend
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://db:5432/formdesk
      DB_USERNAME: formdesk
      DB_PASSWORD: ${DB_PASSWORD:-formdesk_local}
      FRONTEND_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    profiles: ["full"]
    build: ./formdesk-ui
    ports:
      - "127.0.0.1:5173:80"
    depends_on: [backend]
volumes:
  formdesk-postgres:
